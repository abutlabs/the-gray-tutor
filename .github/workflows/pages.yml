# The website on GitHub Pages, https://abutlabs.github.io/the-gray-tutor/. Every push to
# main checks the tools and the lessons' links (npm test, and the build fails on a dead
# link), then publishes the site, with the newest concepts e-book beside it
# (the-gray-tutor-concepts.epub, linked from the start page). epub.yml still makes a
# release of the book, by hand, for a copy that stays.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the site's zip, on the site-latest release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # the e-book's diagrams are drawn with a system monospace font, and the Gray Paper's rarest
      # signs (↯, Ⅎ, ♈) with Symbola: MathJax's own fonts lack them (epub.ts, png)
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-symbola
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Build the site and the e-book
        run: npm run epub
        env:
          SITE_BASE: /the-gray-tutor/
      # the same site as one zip, for reading it served from the tablet itself
      # (tools/boox/gray-tutor.sh): on a release that each push replaces
      - name: Publish the site as a zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd .vitepress/dist && zip -qr "$OLDPWD/site.zip" .)
          gh release view site-latest >/dev/null 2>&1 || gh release create site-latest \
            --title "The Gray Tutor: the website, newest" \
            --notes "The built website as a zip, replaced on every push to main. tools/boox/gray-tutor.sh serves it on a tablet." --latest=false
          gh release upload site-latest site.zip --clobber
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
